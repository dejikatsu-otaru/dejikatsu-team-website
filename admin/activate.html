<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>パスワード設定｜デジ活チーム</title><link rel="stylesheet" href="admin.css"></head><body data-admin-page="activate"><div class="admin-shell"><header class="admin-header"><a class="admin-brand" href="../index.html"><img src="../assets/dejikatsu-logo-cutout.png" alt=""><span>デジ活チーム<small>CONTENT MANAGEMENT</small></span></a></header><main class="admin-main"><section class="admin-card auth-card" aria-labelledby="activate-title"><p class="admin-eyebrow">ACCOUNT ACTIVATION</p><h1 id="activate-title" class="admin-title">パスワードを設定</h1><p class="admin-lead">管理者から発行された一回限りのリンクです。設定後、ログインしてください。</p><form class="admin-form" data-activate-form><div class="field"><label class="required" for="activate-password">新しいパスワード</label><input id="activate-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><small>12文字以上、128文字以内</small></div><p class="status" aria-live="polite" data-status></p><button class="button" type="submit">パスワードを設定</button></form></section></main></div><script src="admin.js"></script></body></html>
