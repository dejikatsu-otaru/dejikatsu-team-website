<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CMS ログイン｜デジ活チーム</title><link rel="stylesheet" href="admin.css"></head><body data-admin-page="login"><div class="admin-shell"><header class="admin-header"><a class="admin-brand" href="../index.html"><img src="../assets/dejikatsu-logo-cutout.png" alt=""><span>デジ活チーム<small>CONTENT MANAGEMENT</small></span></a><a class="text-button" href="../index.html">公開サイトへ</a></header><main class="admin-main"><section class="admin-card auth-card" aria-labelledby="login-title"><p class="admin-eyebrow">SIGN IN</p><h1 id="login-title" class="admin-title">管理画面にログイン</h1><p class="admin-lead">管理者から発行されたIDとパスワードを入力してください。</p><form class="admin-form" data-login-form><div class="field"><label class="required" for="login-id">ID</label><input id="login-id" name="loginId" autocomplete="username" required maxlength="80"></div><div class="field"><label class="required" for="login-password">パスワード</label><input id="login-password" name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></div><p class="status" aria-live="polite" data-status></p><button class="button" type="submit">ログイン</button></form><p class="admin-lead">初回のみ <a href="setup.html">Owner の初期設定</a> を行います。パスワード再設定は、管理者から送られた専用リンクを使ってください。</p></section></main><footer class="admin-footer">© DEJIKATU TEAM</footer></div><script src="admin.js"></script></body></html>
