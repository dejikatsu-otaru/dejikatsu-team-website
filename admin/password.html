<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>パスワード変更｜デジ活チーム CMS</title><link rel="stylesheet" href="admin.css"></head><body data-admin-page="password"><div class="admin-shell"><header class="admin-header"><a class="admin-brand" href="../index.html"><img src="../assets/dejikatsu-logo-cutout.png" alt=""><span>デジ活チーム<small>CONTENT MANAGEMENT</small></span></a><nav class="admin-nav" aria-label="管理メニュー"><a href="dashboard.html">記事管理へ戻る</a><button type="button" data-logout>ログアウト</button></nav></header><main class="admin-main admin-layout"><aside class="admin-sidebar"><p>ログイン中</p><strong data-current-user>読み込み中…</strong><nav><a href="dashboard.html">記事管理</a><a href="editor.html">記事を追加</a><a href="users.html" data-user-management>アカウント管理</a><a href="password.html" aria-current="page">パスワード変更</a></nav></aside><section class="admin-card auth-card" aria-labelledby="password-title"><p class="admin-eyebrow">PASSWORD</p><h1 id="password-title" class="admin-title">パスワードを変更</h1><p class="admin-lead">変更後は安全のためログアウトされます。新しいパスワードは12文字以上、128文字以内にしてください。</p><form class="admin-form" data-password-form><div class="field"><label class="required" for="current-password">現在のパスワード</label><input id="current-password" name="currentPassword" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></div><div class="field"><label class="required" for="new-password">新しいパスワード</label><input id="new-password" name="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></div><div class="field"><label class="required" for="new-password-confirmation">新しいパスワード（確認）</label><input id="new-password-confirmation" name="newPasswordConfirmation" type="password" autocomplete="new-password" required minlength="12" maxlength="128"></div><p class="status" aria-live="polite" data-status></p><div class="button-row"><button class="button" type="submit">パスワードを変更</button><a class="button button-secondary" href="dashboard.html">戻る</a></div></form></section></main></div><script src="admin.js"></script></body></html>
