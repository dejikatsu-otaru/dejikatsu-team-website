<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Owner 初期設定｜デジ活チーム</title><link rel="stylesheet" href="admin.css"></head><body data-admin-page="setup"><div class="admin-shell"><header class="admin-header"><a class="admin-brand" href="../index.html"><img src="../assets/dejikatsu-logo-cutout.png" alt=""><span>デジ活チーム<small>CONTENT MANAGEMENT</small></span></a></header><main class="admin-main"><section class="admin-card auth-card" aria-labelledby="setup-title"><p class="admin-eyebrow">FIRST-RUN SETUP</p><h1 id="setup-title" class="admin-title">固定Ownerを設定</h1><p class="notice">この画面は固定Ownerが未作成の場合のみ使えます。Bootstrap Token はCloudflareの暗号化シークレットであり、共有・保存しないでください。</p><form class="admin-form" data-setup-form><div class="field"><label class="required" for="bootstrap-token">Bootstrap Token</label><input id="bootstrap-token" name="bootstrapToken" type="password" autocomplete="off" required></div><div class="form-grid"><div class="field"><label class="required" for="setup-id">ログインID</label><input id="setup-id" name="loginId" autocomplete="username" required maxlength="80"></div><div class="field"><label class="required" for="setup-name">本名</label><input id="setup-name" name="realName" autocomplete="name" required maxlength="80"></div></div><div class="form-grid"><div class="field"><label class="required" for="setup-title-job">役職</label><input id="setup-title-job" name="jobTitle" required maxlength="80" placeholder="例：代表"></div><div class="field"><label class="required" for="setup-password">パスワード</label><input id="setup-password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><small>12文字以上、128文字以内</small></div></div><p class="status" aria-live="polite" data-status></p><button class="button" type="submit">固定Ownerを作成</button></form></section></main></div><script src="admin.js"></script></body></html>
